<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Newsreader:ital@0;1&display=swap');

  :root{
    --bg:#EFF6FF;
    --bg-deep:#E3EFFF;
    --surface:#FFFFFF;
    --ink:#182233;
    --ink-soft:#66738A;
    --ink-faint:#9AA6BB;
    --line:#E1E9F5;
    --primary:#2F6FED;
    --primary-ink:#1948B3;
    --primary-soft:#E4EEFF;
    --accent:#FF8B5E;
    --accent-soft:#FFE9DC;
    --success:#1FAE6E;
    --success-soft:#DEF7EB;
    --warn:#F0A927;
    --warn-soft:#FFF3DA;
    --purple:#8B5CF6;
    --purple-soft:#EFE9FE;
    --shadow: 0 10px 30px -12px rgba(47,111,237,.18);
    --radius-lg: 1.4rem;
    --radius-md: 1rem;
    --radius-sm: 0.7rem;
  }

  /* Fluid sizing linked to the device's actual viewport width */
  html{
    font-size: clamp(14px, 3.1vw, 18.5px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body{
    margin:0;
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(120% 60% at 100% 0%, #DCEBFF 0%, transparent 55%),
      radial-gradient(90% 50% at 0% 100%, #FFE7D8 0%, transparent 45%),
      var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    color:var(--ink);
  }

  .app-frame{
    width:100%;
    max-width:30rem;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  @media (min-width: 30rem){
    .app-frame{
      height: min(100vh, 52rem);
      height: min(100dvh, 52rem);
      margin: clamp(0px, 3vh, 2.5rem) 0;
      border-radius: 2.2rem;
      box-shadow: 0 40px 80px -30px rgba(20,40,90,.35), 0 0 0 10px #0E1B33;
      overflow:hidden;
    }
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 1.3rem 1.2rem 0.9rem;
  }
  .brand-left{ display:flex; align-items:center; gap:0.7rem; }
  .brand-mark{
    width:2.6rem; height:2.6rem; border-radius:0.8rem;
    background:linear-gradient(155deg, var(--primary), #5B93FF);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 16px -6px rgba(47,111,237,.55);
  }
  .brand-mark svg{ width:1.3rem; height:1.3rem; }
  .brand-name{ font-family:'Newsreader', Georgia, serif; font-size:1.35rem; font-weight:600; line-height:1; color:var(--ink); }
  .brand-sub{ font-size:0.72rem; color:var(--ink-soft); margin-top:0.25rem; }
  .manual-btn{
    display:flex; align-items:center; gap:0.3rem;
    background:var(--surface); border:1px solid var(--line);
    padding:0.5rem 0.8rem; border-radius:999px;
    font-size:0.75rem; font-weight:600; color:var(--ink-soft);
  }
  .manual-btn svg{ width:0.9rem; height:0.9rem; }

  main{ flex:1; padding: 0.2rem 1.2rem 6.5rem; overflow-y:auto; }
  .screen{ display:none; animation: fadein .25s ease; }
  .screen.active{ display:block; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  h2.section-title{ font-size:0.95rem; font-weight:700; color:var(--ink); margin: 1.3rem 0 0.7rem; }
  .section-title.first{ margin-top:0.3rem; }

  .card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:1.1rem;
  }

  /* HOME */
  .hero-card{
    background:linear-gradient(135deg, var(--primary) 0%, #5B93FF 100%);
    color:white; border-radius:var(--radius-lg);
    padding:1.2rem 1.3rem;
    box-shadow: 0 16px 30px -14px rgba(47,111,237,.55);
  }
  .hero-label{ font-size:0.75rem; opacity:0.85; font-weight:500; }
  .hero-main{ font-size:1.2rem; font-weight:700; margin:0.35rem 0 0.3rem; line-height:1.35; }
  .hero-sub{ font-size:0.78rem; opacity:0.9; }
  .hero-chip{
    display:inline-flex; align-items:center; gap:0.3rem;
    background:rgba(255,255,255,.18); border-radius:999px;
    padding:0.3rem 0.6rem; font-size:0.72rem; margin-top:0.6rem;
  }

  .today-card{ margin-top:0.9rem; }
  .today-date{ font-size:0.95rem; font-weight:700; }
  .today-body{ font-size:0.82rem; color:var(--ink-soft); margin-top:0.4rem; line-height:1.5; }
  .today-tag{
    display:inline-flex; align-items:center; gap:0.35rem;
    font-size:0.75rem; font-weight:600; padding:0.35rem 0.6rem;
    border-radius:0.6rem; margin-top:0.55rem;
  }

  .week-strip{
    display:grid; grid-template-columns:repeat(7,1fr); gap:0.35rem;
    background:var(--surface); border-radius:var(--radius-lg);
    padding:0.9rem 0.6rem; box-shadow:var(--shadow);
  }
  .week-strip .wd{ text-align:center; font-size:0.7rem; color:var(--ink-faint); margin-bottom:0.4rem; }
  .day-pill{
    aspect-ratio:1; border-radius:0.7rem; display:flex; align-items:center; justify-content:center;
    font-size:0.8rem; font-weight:600; color:var(--ink); cursor:pointer; position:relative;
  }
  .day-pill.today{ background:var(--primary); color:white; }
  .day-pill.has-dot::after{
    content:''; position:absolute; bottom:0.2rem; width:0.3rem; height:0.3rem; border-radius:50%; background:var(--accent);
  }
  .day-pill.today.has-dot::after{ background:white; }

  .upcoming-item{
    display:flex; align-items:center; gap:0.7rem;
    background:var(--surface); border-radius:var(--radius-md);
    padding:0.75rem 0.9rem; box-shadow:var(--shadow); margin-bottom:0.6rem;
  }
  .cat-bar{ width:0.3rem; align-self:stretch; border-radius:999px; }
  .upcoming-info{ flex:1; min-width:0; }
  .upcoming-title{ font-size:0.85rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .upcoming-meta{ font-size:0.72rem; color:var(--ink-soft); margin-top:0.2rem; }
  .cat-badge{ font-size:0.65rem; font-weight:700; padding:0.25rem 0.5rem; border-radius:999px; white-space:nowrap; }

  .empty-state{
    text-align:center; padding:2rem 1rem; color:var(--ink-faint); font-size:0.82rem;
    background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow);
  }
  .empty-state svg{ width:2.2rem; height:2.2rem; margin-bottom:0.6rem; color:var(--ink-faint); }

  /* CALENDAR */
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin:0.4rem 0 0.9rem; }
  .cal-title{ font-size:1rem; font-weight:700; }
  .cal-nav{ display:flex; gap:0.4rem; }
  .icon-btn{
    width:2.1rem; height:2.1rem; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .icon-btn svg{ width:1rem; height:1rem; }

  .cal-grid{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:0.9rem 0.6rem; }
  .cal-dow{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:0.5rem; }
  .cal-dow span{ text-align:center; font-size:0.7rem; color:var(--ink-faint); font-weight:600; }
  .cal-cells{ display:grid; grid-template-columns:repeat(7,1fr); gap:0.25rem; }
  .cal-cell{
    aspect-ratio:1; border-radius:0.7rem; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:0.78rem; font-weight:600; cursor:pointer; position:relative; gap:0.15rem;
  }
  .cal-cell.blank{ visibility:hidden; }
  .cal-cell.today{ box-shadow: inset 0 0 0 2px var(--primary); color:var(--primary-ink); }
  .cal-cell.selected{ background:var(--primary); color:white; }
  .cal-dots{ display:flex; gap:0.15rem; }
  .cal-dots span{ width:0.28rem; height:0.28rem; border-radius:50%; }

  .legend{ display:flex; flex-wrap:wrap; gap:0.9rem; justify-content:center; margin-top:1rem; font-size:0.72rem; color:var(--ink-soft); }
  .legend span.dot{ width:0.5rem; height:0.5rem; border-radius:50%; display:inline-block; margin-right:0.3rem; }

  .day-detail{ margin-top:1rem; }
  .day-detail-title{ font-size:0.9rem; font-weight:700; margin-bottom:0.6rem; }
  .quick-input-card{
    background:var(--primary-soft); border-radius:var(--radius-md);
    padding:0.9rem 1rem; margin-top:0.7rem;
  }
  .quick-input-title{
    display:flex; align-items:center; gap:0.4rem;
    font-size:0.82rem; font-weight:700; color:var(--primary-ink);
  }
  .quick-input-title svg{ width:0.95rem; height:0.95rem; }
  .quick-input-desc{ font-size:0.72rem; color:var(--ink-soft); margin-top:0.3rem; line-height:1.5; }

  /* SCHEDULE TAB */
  .sched-add-btn{
    display:flex; align-items:center; justify-content:center; gap:0.4rem;
    width:100%; padding:0.85rem; border-radius:var(--radius-md);
    background:linear-gradient(135deg, var(--accent), #FFA97C); color:white; font-weight:700; font-size:0.85rem;
    border:none; box-shadow:0 12px 22px -12px rgba(255,139,94,.7); margin-bottom:1rem;
  }
  .sched-add-btn svg{ width:1rem; height:1rem; }

  .filter-row{ display:flex; gap:0.4rem; margin-bottom:1rem; overflow-x:auto; padding-bottom:0.1rem; }
  .filter-chip{
    flex-shrink:0; padding:0.4rem 0.8rem; border-radius:999px; font-size:0.75rem; font-weight:600;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .filter-chip.active{ background:var(--ink); color:white; border-color:var(--ink); }

  .sched-group-label{ font-size:0.78rem; font-weight:700; color:var(--ink-faint); margin:1rem 0 0.5rem; }

  .sched-item{
    display:flex; align-items:stretch; gap:0.75rem;
    background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow);
    padding:0.85rem 0.9rem; margin-bottom:0.6rem;
  }
  .sched-item .date-block{ text-align:center; min-width:2.6rem; }
  .sched-item .date-block .dow{ font-size:0.65rem; color:var(--ink-faint); font-weight:600; }
  .sched-item .date-block .dnum{ font-size:1.05rem; font-weight:800; color:var(--ink); }
  .sched-item .info{ flex:1; min-width:0; }
  .sched-item .title-row{ display:flex; align-items:center; gap:0.4rem; }
  .sched-item .title{ font-size:0.86rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sched-item .time{ font-size:0.72rem; color:var(--ink-soft); margin-top:0.2rem; }
  .sched-item .memo{ font-size:0.72rem; color:var(--ink-faint); margin-top:0.15rem; }
  .sched-item .actions{ display:flex; flex-direction:column; gap:0.35rem; }
  .sched-item .actions button{ width:1.7rem; height:1.7rem; border-radius:0.5rem; border:none; background:var(--bg-deep); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; }
  .sched-item .actions button svg{ width:0.85rem; height:0.85rem; }

  /* INPUT */
  .import-card{ text-align:left; }
  .import-title{ font-size:0.92rem; font-weight:700; margin-bottom:0.35rem; }
  .import-desc{ font-size:0.78rem; color:var(--ink-soft); line-height:1.5; margin-bottom:0.9rem; }
  .import-btn{
    width:100%; padding:0.9rem; border-radius:var(--radius-md); border:none;
    background:var(--primary-soft); color:var(--primary-ink); font-weight:700; font-size:0.85rem;
    display:flex; align-items:center; justify-content:center; gap:0.5rem;
  }
  .import-btn svg{ width:1rem; height:1rem; }

  .pattern-card{ padding:0.4rem 1.1rem; }
  .pattern-desc{ font-size:0.78rem; color:var(--ink-soft); padding:0.9rem 0 0.6rem; line-height:1.5; }
  .pattern-row{ display:flex; align-items:center; gap:0.8rem; padding:0.75rem 0; border-top:1px solid var(--line); }
  .pattern-row:first-of-type{ border-top:none; }
  .pattern-day{ width:1.3rem; font-weight:700; font-size:0.85rem; }
  .toggle{ position:relative; width:2.5rem; height:1.4rem; border-radius:999px; background:var(--line); flex-shrink:0; cursor:pointer; transition:background .2s; }
  .toggle::after{ content:''; position:absolute; top:0.15rem; left:0.15rem; width:1.1rem; height:1.1rem; border-radius:50%; background:white; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .toggle.on{ background:var(--primary); }
  .toggle.on::after{ transform:translateX(1.1rem); }
  .time-inputs{ display:flex; gap:0.4rem; flex:1; justify-content:flex-end; }
  .time-inputs input{
    width:5.4rem; border:1px solid var(--line); border-radius:0.6rem; padding:0.4rem 0.5rem;
    font-size:0.78rem; font-family:inherit; color:var(--ink); background:var(--bg-deep);
  }
  .time-inputs input:disabled{ opacity:0.45; }

  .callout{
    display:flex; gap:0.6rem; align-items:flex-start;
    background:var(--purple-soft); border-radius:var(--radius-md); padding:0.9rem; margin-top:1rem;
    font-size:0.76rem; color:#5B3FBF; line-height:1.5;
  }
  .callout svg{ width:1rem; height:1rem; flex-shrink:0; margin-top:0.1rem; }
  .callout a{ color:#5B3FBF; font-weight:700; text-decoration:underline; cursor:pointer; }

  /* SETTINGS */
  .settings-card{ margin-bottom:1rem; }
  .settings-desc{ font-size:0.8rem; color:var(--ink-soft); margin-bottom:0.8rem; }
  .chip-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; margin-bottom:0.9rem; }
  .chip-btn{
    padding:0.7rem 0; text-align:center; border-radius:0.7rem; border:1px solid var(--line);
    background:var(--bg-deep); font-size:0.82rem; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .chip-btn.active{ background:var(--primary); color:white; border-color:var(--primary); }
  .list-btn{
    width:100%; padding:0.85rem; border-radius:var(--radius-md); border:1px solid var(--line);
    background:var(--bg-deep); font-weight:700; font-size:0.82rem; color:var(--ink); margin-bottom:0.6rem;
    display:flex; align-items:center; justify-content:center; gap:0.5rem;
  }
  .list-btn svg{ width:0.95rem; height:0.95rem; }
  .list-btn.danger{ background:#FFECEA; color:#D6432E; }
  .note-text{ font-size:0.75rem; color:var(--ink-faint); line-height:1.5; margin-bottom:0.8rem; }

  /* NAV */
  nav.tabbar{
    position:absolute; left:0; right:0; bottom:0;
    background:var(--surface); border-top:1px solid var(--line);
    display:grid; grid-template-columns:repeat(5,1fr);
    padding:0.55rem 0.3rem calc(0.55rem + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 20px -14px rgba(20,40,90,.25);
  }
  .tab-btn{
    display:flex; flex-direction:column; align-items:center; gap:0.25rem;
    background:none; border:none; color:var(--ink-faint); font-size:0.62rem; font-weight:600; font-family:inherit;
    padding:0.2rem 0;
  }
  .tab-btn svg{ width:1.25rem; height:1.25rem; }
  .tab-btn.active{ color:var(--primary); }

  /* SHEET / MODAL */
  .overlay{
    position:absolute; inset:0; background:rgba(15,25,50,.45);
    display:none; align-items:flex-end; justify-content:center; z-index:20;
  }
  .overlay.open{ display:flex; }
  .sheet{
    width:100%; max-width:30rem; background:var(--surface);
    border-radius:1.6rem 1.6rem 0 0; padding:1.3rem 1.2rem calc(1.3rem + env(safe-area-inset-bottom));
    max-height:85%; overflow-y:auto; animation:slideup .25s ease;
  }
  @keyframes slideup{ from{ transform:translateY(100%);} to{ transform:none;} }
  .sheet-handle{ width:2.4rem; height:0.28rem; border-radius:999px; background:var(--line); margin:0 auto 1rem; }
  .sheet-title{ font-size:1.02rem; font-weight:800; margin-bottom:1rem; }
  .field-label{ font-size:0.76rem; font-weight:700; color:var(--ink-soft); margin:0.8rem 0 0.4rem; }
  .field-label.first{ margin-top:0; }
  .field-input, .field-textarea{
    width:100%; border:1px solid var(--line); border-radius:0.75rem; padding:0.7rem 0.8rem;
    font-size:0.85rem; font-family:inherit; color:var(--ink); background:var(--bg-deep);
  }
  .field-textarea{ resize:none; height:3.6rem; }
  .field-row{ display:flex; gap:0.6rem; }
  .field-row .field-input{ flex:1; }
  .cat-select{ display:flex; gap:0.5rem; flex-wrap:wrap; }
  .cat-opt{
    padding:0.5rem 0.85rem; border-radius:999px; font-size:0.78rem; font-weight:700; cursor:pointer;
    border:1.5px solid var(--line); color:var(--ink-soft); background:var(--surface);
  }
  .cat-opt.active{ border-color:transparent; color:white; }
  .sheet-actions{ display:flex; gap:0.6rem; margin-top:1.4rem; }
  .btn{ flex:1; padding:0.85rem; border-radius:0.85rem; border:none; font-weight:700; font-size:0.85rem; font-family:inherit; }
  .btn-ghost{ background:var(--bg-deep); color:var(--ink-soft); }
  .btn-primary{ background:var(--primary); color:white; }

  /* TOAST */
  .toast{
    position:absolute; left:50%; bottom:5.6rem; transform:translateX(-50%) translateY(1rem);
    background:var(--ink); color:white; padding:0.7rem 1.1rem; border-radius:999px;
    font-size:0.78rem; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease; z-index:30;
    white-space:nowrap; box-shadow:0 12px 24px -10px rgba(0,0,0,.4);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* MANUAL POPUP */
  .manual-intro{ font-size:0.82rem; color:var(--ink-soft); line-height:1.55; margin-bottom:1.1rem; }
  .manual-feature{ display:flex; gap:0.8rem; padding:0.85rem 0; border-top:1px solid var(--line); }
  .manual-feature:first-of-type{ border-top:none; }
  .manual-icon{
    width:2.3rem; height:2.3rem; border-radius:0.75rem; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .manual-icon svg{ width:1.15rem; height:1.15rem; }
  .manual-feature-title{ font-size:0.85rem; font-weight:700; margin-bottom:0.2rem; }
  .manual-feature-desc{ font-size:0.76rem; color:var(--ink-soft); line-height:1.5; }
  .manual-tip{
    display:flex; gap:0.6rem; align-items:flex-start;
    background:var(--primary-soft); border-radius:var(--radius-md); padding:0.85rem;
    margin-top:1rem; font-size:0.76rem; color:var(--primary-ink); line-height:1.55;
  }
  .manual-tip svg{ width:1rem; height:1rem; flex-shrink:0; margin-top:0.1rem; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>

<div class="app-frame" id="appFrame">

  <div class="brand">
    <div class="brand-left">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </div>
      <div>
        <div class="brand-name">Happy 7/24</div>
        <div class="brand-sub">유연근무 출·퇴근 &amp; 스케줄 관리</div>
      </div>
    </div>
    <button class="manual-btn" onclick="openManualSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      설명서
    </button>
  </div>

  <main>
    <!-- HOME -->
    <section class="screen" id="screen-home"></section>
    <!-- CALENDAR -->
    <section class="screen" id="screen-calendar"></section>
    <!-- SCHEDULE -->
    <section class="screen" id="screen-schedule"></section>
    <!-- INPUT -->
    <section class="screen" id="screen-input"></section>
    <!-- SETTINGS -->
    <section class="screen" id="screen-settings"></section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7"></path><path d="M9 22V12h6v10"></path><path d="M5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10"></path></svg>
      홈
    </button>
    <button class="tab-btn" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      근무일정
    </button>
    <button class="tab-btn" data-tab="schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      스케줄
    </button>
    <button class="tab-btn" data-tab="input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      입력
    </button>
    <button class="tab-btn" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      설정
    </button>
  </nav>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<input type="file" id="photoInput" accept="image/*" style="display:none">

<script>
/* ---------------- STATE ---------------- */
const CATS = {
  work:    { label:'근무',  color:'#2F6FED', soft:'#E4EEFF' },
  meeting: { label:'회의',  color:'#8B5CF6', soft:'#EFE9FE' },
  personal:{ label:'개인',  color:'#FF8B5E', soft:'#FFE9DC' },
  holiday: { label:'휴일',  color:'#F0A927', soft:'#FFF3DA' },
};

const DOW = ['일','월','화','수','목','금','토'];

const _now = new Date();

let state = {
  today: new Date(_now.getFullYear(), _now.getMonth(), _now.getDate()),
  activeTab: 'home',
  calYear: _now.getFullYear(), calMonth: _now.getMonth(),
  selectedDate: null,
  scheduleFilter: 'all',
  pattern: {
    0:{on:false, start:'09:00', end:'18:00'},
    1:{on:true,  start:'09:00', end:'18:00'},
    2:{on:true,  start:'09:00', end:'18:00'},
    3:{on:true,  start:'09:00', end:'18:00'},
    4:{on:true,  start:'09:00', end:'18:00'},
    5:{on:true,  start:'09:00', end:'18:00'},
    6:{on:false, start:'09:00', end:'18:00'},
  },
  schedules: [
    {id:1, date:'2026-09-04', start:'10:00', end:'11:00', title:'주간 팀 회의', category:'meeting', memo:'3층 회의실 A'},
    {id:2, date:'2026-09-11', start:'', end:'', title:'재택근무', category:'work', memo:'재택 신청 완료'},
    {id:3, date:'2026-09-16', start:'19:00', end:'21:00', title:'동료 환송회', category:'personal', memo:''},
    {id:4, date:'2026-09-24', start:'', end:'', title:'추석 연휴', category:'holiday', memo:''},
    {id:5, date:'2026-09-25', start:'', end:'', title:'추석 연휴', category:'holiday', memo:''},
    {id:6, date:'2026-09-26', start:'', end:'', title:'추석 연휴', category:'holiday', memo:''},
  ],
  notifyLead: 10,
  nextId: 7,
};

/* ---------------- HELPERS ---------------- */
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function schedulesOn(dateStr){ return state.schedules.filter(s=>s.date===dateStr); }
function fmtMD(d){ return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; }
function fmtTimeRange(s){ if(!s.start && !s.end) return '종일'; return `${s.start||'--:--'} ~ ${s.end||'--:--'}`; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- NAV ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});
function switchTab(tab){
  state.activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  renderAll();
}

/* ---------------- RENDER: HOME ---------------- */
function renderHome(){
  const el = document.getElementById('screen-home');
  const todayStr = fmtDate(state.today);
  const upcoming = state.schedules
    .filter(s=> s.date >= todayStr)
    .sort((a,b)=> a.date===b.date ? (a.start||'').localeCompare(b.start||'') : a.date.localeCompare(b.date));
  const next = upcoming[0];
  const todaysSchedules = schedulesOn(todayStr);
  const pat = state.pattern[state.today.getDay()];

  let heroHtml;
  if(next){
    const d = parseDate(next.date);
    const isToday = next.date === todayStr;
    heroHtml = `
      <div class="hero-label">다음 일정까지</div>
      <div class="hero-main">${next.title}</div>
      <div class="hero-sub">${isToday ? '오늘' : fmtMD(d)} · ${fmtTimeRange(next)}</div>
      <div class="hero-chip">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        ${state.notifyLead}분 전 알림 예정
      </div>`;
  }else{
    heroHtml = `
      <div class="hero-label">다음 알림</div>
      <div class="hero-main">예정된 일정이 없어요</div>
      <div class="hero-sub">스케줄 탭에서 새 일정을 추가해보세요</div>`;
  }

  let todayBody;
  if(pat && pat.on){
    todayBody = `<span class="today-tag" style="background:var(--primary-soft); color:var(--primary-ink);">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      오전 ${pat.start} ~ 오후 ${pat.end} 근무 예정</span>`;
  }else{
    todayBody = `<span class="today-tag" style="background:var(--bg-deep); color:var(--ink-soft);">오늘은 기본 근무가 없는 날이에요</span>`;
  }
  const todaySchedHtml = todaysSchedules.map(s=>`
    <span class="today-tag" style="background:${CATS[s.category].soft}; color:${CATS[s.category].color}; margin-left:0.4rem;">${s.title}</span>
  `).join('');

  const weekStart = new Date(state.today);
  weekStart.setDate(state.today.getDate() - state.today.getDay());
  let weekCellsHtml = '';
  for(let i=0;i<7;i++){
    const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
    const ds = fmtDate(d);
    const isToday = sameDay(d, state.today);
    const hasDot = schedulesOn(ds).length>0;
    weekCellsHtml += `<div class="day-pill ${isToday?'today':''} ${hasDot?'has-dot':''}" onclick="openDayFromHome('${ds}')">${d.getDate()}</div>`;
  }
  const weekDowHtml = DOW.map(w=>`<div class="wd">${w}</div>`).join('');

  const upcomingHtml = upcoming.slice(0,4).map(s=>{
    const d = parseDate(s.date);
    const c = CATS[s.category];
    return `<div class="upcoming-item">
      <div class="cat-bar" style="background:${c.color}"></div>
      <div class="upcoming-info">
        <div class="upcoming-title">${s.title}</div>
        <div class="upcoming-meta">${fmtMD(d)} · ${fmtTimeRange(s)}</div>
      </div>
      <span class="cat-badge" style="background:${c.soft}; color:${c.color};">${c.label}</span>
    </div>`;
  }).join('') || `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <div>다가오는 일정이 없어요</div>
    </div>`;

  el.innerHTML = `
    <div class="hero-card">${heroHtml}</div>
    <div class="card today-card">
      <div class="today-date">${fmtMD(state.today)}</div>
      <div class="today-body">${todayBody}${todaySchedHtml}</div>
    </div>
    <h2 class="section-title">이번 주</h2>
    <div class="week-strip">
      ${weekDowHtml}
      ${weekCellsHtml}
    </div>
    <h2 class="section-title">다가오는 일정</h2>
    ${upcomingHtml}
  `;
}
function openDayFromHome(ds){
  switchTab('calendar');
  const d = parseDate(ds);
  state.calYear = d.getFullYear(); state.calMonth = d.getMonth();
  state.selectedDate = ds;
  renderAll();
}

/* ---------------- RENDER: CALENDAR ---------------- */
function renderCalendar(){
  const el = document.getElementById('screen-calendar');
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();

  let cellsHtml = '';
  for(let i=0;i<startOffset;i++) cellsHtml += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(y,m,d);
    const ds = fmtDate(dateObj);
    const isToday = sameDay(dateObj, state.today);
    const isSelected = state.selectedDate === ds;
    const daySchedules = schedulesOn(ds);
    const cats = [...new Set(daySchedules.map(s=>s.category))].slice(0,3);
    const dotsHtml = cats.map(c=>`<span style="background:${CATS[c].color}"></span>`).join('');
    cellsHtml += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectDay('${ds}')">
        <div>${d}</div>
        <div class="cal-dots">${dotsHtml}</div>
      </div>`;
  }

  let detailHtml = '';
  if(state.selectedDate){
    const d = parseDate(state.selectedDate);
    const daySchedules = schedulesOn(state.selectedDate);
    const pat = state.pattern[d.getDay()];
    const patHtml = pat && pat.on
      ? `<div class="upcoming-item"><div class="cat-bar" style="background:var(--primary)"></div>
          <div class="upcoming-info"><div class="upcoming-title">기본 근무</div>
          <div class="upcoming-meta">오전 ${pat.start} ~ 오후 ${pat.end}</div></div></div>`
      : '';
    const schedHtml = daySchedules.map(s=>{
      const c = CATS[s.category];
      return `<div class="upcoming-item">
        <div class="cat-bar" style="background:${c.color}"></div>
        <div class="upcoming-info"><div class="upcoming-title">${s.title}</div>
        <div class="upcoming-meta">${fmtTimeRange(s)}${s.memo?' · '+s.memo:''}</div></div>
        <span class="cat-badge" style="background:${c.soft}; color:${c.color};">${c.label}</span>
      </div>`;
    }).join('');
    const nothing = (!pat || !pat.on) && daySchedules.length===0
      ? `<div class="empty-state" style="padding:1.4rem;">등록된 일정이 없어요</div>` : '';
    const existingWork = daySchedules.find(s=>s.category==='work');
    const qStart = existingWork ? existingWork.start : (pat ? pat.start : '09:00');
    const qEnd = existingWork ? existingWork.end : (pat ? pat.end : '18:00');
    const quickInputHtml = `
      <div class="quick-input-card">
        <div class="quick-input-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          이 날짜 근무일정 입력
        </div>
        <div class="quick-input-desc">${existingWork ? '등록된 근무시간을 수정할 수 있어요.' : '기본 패턴과 다른 출·퇴근 시간이면 여기서 바로 입력하세요.'}</div>
        <div class="field-row" style="margin-top:0.6rem;">
          <input class="field-input" id="qw-start" type="time" value="${qStart}">
          <input class="field-input" id="qw-end" type="time" value="${qEnd}">
        </div>
        <div class="sheet-actions" style="margin-top:0.8rem;">
          ${existingWork ? `<button class="btn btn-ghost" onclick="deleteSchedule(${existingWork.id})">삭제</button>` : ''}
          <button class="btn btn-primary" onclick="saveQuickWork('${state.selectedDate}', ${existingWork?existingWork.id:'null'})">${existingWork ? '수정 저장' : '근무일정 저장'}</button>
        </div>
      </div>`;
    detailHtml = `
      <div class="day-detail">
        <div class="day-detail-title">${fmtMD(d)}</div>
        ${patHtml}${schedHtml}${nothing}
        ${quickInputHtml}
      </div>`;
  }

  el.innerHTML = `
    <div class="cal-header">
      <div class="cal-title">${y}년 ${m+1}월</div>
      <div class="cal-nav">
        <button class="icon-btn" onclick="shiftMonth(-1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="icon-btn" onclick="shiftMonth(1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">${DOW.map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="cal-cells">${cellsHtml}</div>
    </div>
    <div class="legend">
      ${Object.values(CATS).map(c=>`<span><span class="dot" style="background:${c.color}"></span>${c.label}</span>`).join('')}
    </div>
    ${detailHtml}
  `;
}
function shiftMonth(delta){
  let m = state.calMonth + delta, y = state.calYear;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  state.calMonth = m; state.calYear = y; state.selectedDate = null;
  renderAll();
}
function selectDay(ds){
  state.selectedDate = state.selectedDate===ds ? null : ds;
  renderAll();
}
function saveQuickWork(ds, existingId){
  const start = document.getElementById('qw-start').value;
  const end = document.getElementById('qw-end').value;
  if(!start || !end){ showToast('출근·퇴근 시간을 모두 입력해주세요'); return; }
  if(existingId){
    const s = state.schedules.find(s=>s.id===existingId);
    Object.assign(s, {start, end});
  }else{
    state.schedules.push({id: state.nextId++, date: ds, start, end, title:'근무', category:'work', memo:''});
  }
  showToast('근무일정을 저장했어요');
  renderAll();
}

/* ---------------- RENDER: SCHEDULE ---------------- */
function renderSchedule(){
  const el = document.getElementById('screen-schedule');
  const todayStr = fmtDate(state.today);
  let list = [...state.schedules];
  if(state.scheduleFilter !== 'all') list = list.filter(s=>s.category===state.scheduleFilter);
  list.sort((a,b)=> a.date===b.date ? (a.start||'').localeCompare(b.start||'') : a.date.localeCompare(b.date));
  const upcoming = list.filter(s=>s.date>=todayStr);
  const past = list.filter(s=>s.date<todayStr).reverse();

  function itemHtml(s){
    const d = parseDate(s.date);
    const c = CATS[s.category];
    return `<div class="sched-item">
      <div class="date-block">
        <div class="dow">${DOW[d.getDay()]}</div>
        <div class="dnum">${d.getDate()}</div>
      </div>
      <div class="info">
        <div class="title-row">
          <span class="title">${s.title}</span>
          <span class="cat-badge" style="background:${c.soft}; color:${c.color};">${c.label}</span>
        </div>
        <div class="time">${fmtTimeRange(s)}</div>
        ${s.memo?`<div class="memo">${s.memo}</div>`:''}
      </div>
      <div class="actions">
        <button onclick="exportOneToICS(${s.id})" title="캘린더에 추가">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><line x1="12" y1="14" x2="12" y2="18"></line><line x1="10" y1="16" x2="14" y2="16"></line></svg>
        </button>
        <button onclick="openScheduleSheet(${s.id})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"></path></svg>
        </button>
        <button onclick="deleteSchedule(${s.id})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </div>`;
  }

  const filterHtml = `<div class="filter-chip ${state.scheduleFilter==='all'?'active':''}" onclick="setScheduleFilter('all')">전체</div>` +
    Object.entries(CATS).map(([k,c])=>`<div class="filter-chip ${state.scheduleFilter===k?'active':''}" onclick="setScheduleFilter('${k}')">${c.label}</div>`).join('');

  el.innerHTML = `
    <button class="sched-add-btn" onclick="openScheduleSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      새 일정 추가
    </button>
    <button class="import-btn" style="margin-bottom:1rem;" onclick="exportAllToICS()">

function saveSchedule(id){
  const title = document.getElementById('f-title').value.trim();
  const date = document.getElementById('f-date').value;
  if(!title || !date){ showToast('제목과 날짜를 입력해주세요'); return; }
  const start = document.getElementById('f-start').value;
  const end = document.getElementById('f-end').value;
  const memo = document.getElementById('f-memo').value.trim();
  const category = document.getElementById('sheet').dataset.cat || 'work';
  if(id){

    Object.assign(s, {title, date, start, end, memo, category});

  }else{
    state.schedules.push({id: state.nextId++, title, date, start, end, memo, category});
    showToast('일정을 추가했어요');
  }
  closeSheet();
  renderAll();
}

/* ---------------- CALENDAR EXPORT (.ics for iPhone/Apple Calendar) ---------------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function icsEscape(s){
  return (s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function toICSDateStr(dateStr){ return dateStr.replace(/-/g,''); }
function addDaysToDateStr(dateStr, n){
  const d = parseDate(dateStr);
  d.setDate(d.getDate()+n);
  return fmtDate(d);
}
function icsNowStamp(){
  const d = new Date();
  return `${d.getUTCFullYear()}${pad2(d.getUTCMonth()+1)}${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}${pad2(d.getUTCSeconds())}Z`;
}
function scheduleToVEVENT(s){
  const uid = `happy724-${s.id}@happy7-24.local`;
  const dtstamp = icsNowStamp();
  let dtstart, dtend;
  if(s.start && s.end){
    dtstart = `DTSTART:${toICSDateStr(s.date)}T${s.start.replace(':','')}00`;
    dtend   = `DTEND:${toICSDateStr(s.date)}T${s.end.replace(':','')}00`;
  }else{
    dtstart = `DTSTART;VALUE=DATE:${toICSDateStr(s.date)}`;
    dtend   = `DTEND;VALUE=DATE:${toICSDateStr(addDaysToDateStr(s.date,1))}`;
  }
  const summary = icsEscape(`[${CATS[s.category].label}] ${s.title}`);
  const desc = icsEscape(s.memo || '');
  const lines = [
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${dtstamp}`,
    dtstart,
    dtend,
    `SUMMARY:${summary}`,
  ];
  if(desc) lines.push(`DESCRIPTION:${desc}`);
  if(s.start && s.end){
    lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${summary}`, `TRIGGER:-PT${state.notifyLead}M`, 'END:VALARM');
  }
  lines.push('END:VEVENT');
  return lines.join('\r\n');
}
function buildICS(events){
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Happy 7-24//KO',
    'CALSCALE:GREGORIAN',
    events.map(scheduleToVEVENT).join('\r\n'),
    'END:VCALENDAR'
  ].join('\r\n');
}
function downloadICS(icsText, filename){
  const blob = new Blob([icsText], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  showToast('캘린더 파일을 내려받았어요. 파일을 열어 아이폰 캘린더에 추가하세요');
}
function exportAllToICS(){
  if(state.schedules.length===0){ showToast('내보낼 일정이 없어요'); return; }
  downloadICS(buildICS(state.schedules), 'happy-7-24-schedules.ics');
}
function exportOneToICS(id){
  const s = state.schedules.find(s=>s.id===id);
  if(!s) return;
  downloadICS(buildICS([s]), `${s.title.replace(/\s+/g,'_')}.ics`);
}

/* ---------------- INIT ---------------- */
function renderAll(){
  renderHome();
  renderCalendar();
  renderSchedule();
  renderInput();
  renderSettings();
}
switchTab('home');
</script>
</body>
